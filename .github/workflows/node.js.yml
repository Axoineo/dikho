# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - name: Scan source and build output for baked secrets
      run: npm run scan:secrets
    - run: npm test --if-present

  secret-scan:
    # Full-tree secret scan with gitleaks. Runs without installing deps, so the
    # working tree is just the tracked source (no node_modules / no dist).
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install gitleaks
      run: |
        GITLEAKS_VERSION=8.21.2
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | tar -xz -C /usr/local/bin gitleaks
        gitleaks version
    - name: Run gitleaks
      run: gitleaks detect --no-git --config .gitleaks.toml --redact --no-banner --verbose
